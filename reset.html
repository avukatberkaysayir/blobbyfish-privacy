<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blobby Fish</title>
<!--
  Yeni parola formu.

  NEDEN BURADA, SUPABASE'DE DEĞİL: Supabase Edge Function'lar HTML servis
  etmiyor (geçit text/html'i text/plain'e çeviriyor), yani form oradan
  sunulamıyor. İş bölümü: bu sayfa yalnızca formu gösterir ve parolayı
  fonksiyona JSON olarak POST eder; jetonun doğrulanması, parolanın
  değiştirilmesi ve oturumların iptali hep sunucuda.

  Sayfanın hiçbir yetkisi yok: elinde yalnızca adresteki tek kullanımlık
  jeton var, o da zaten oyuncunun postasından geldi.
-->
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0a293f; color: #eaf6ff; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  main { text-align: center; padding: 40px 20px; width: 100%; max-width: 340px; }
  h1 { color: #f7761a; margin: 0 0 10px; font-size: 1.6em; }
  h1.bad { color: #ff6b6b; }
  p { color: #9fc0d4; line-height: 1.5; }
  p.err { color: #ff6b6b; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0;
          border-radius: 6px; border: 1px solid #1d4a6b; background: #06202f;
          color: #eaf6ff; font-size: 16px; }
  button { width: 100%; padding: 13px; margin-top: 10px; background: #f7761a;
           color: #fff; border: 0; border-radius: 6px; font-size: 16px;
           cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  small { color: #67839a; }
</style>
</head>
<body>
<main>
  <h1 id="t">Blobby Fish</h1>
  <p id="intro"></p>
  <p id="err" class="err" hidden></p>
  <form id="f">
    <input id="p1" type="password" autocomplete="new-password" required>
    <input id="p2" type="password" autocomplete="new-password" required>
    <button id="go" type="submit"></button>
  </form>
  <p><small id="hint"></small></p>
</main>
<script>
// Sunucudaki alt sınırla AYNI olmak zorunda (reset-password/index.ts MIN_PASS
// ve oyundaki Net.MIN_PASS). Ayrışırsa oyuncu burada kabul edilen bir parolayı
// oyunda giremez, ya da tersi.
const MIN = 6;
const FN = "https://rnhehvzcacpsmfxsokfo.supabase.co/functions/v1/reset-password";

const T = {
  en: { title: "New password", intro: "Choose a new password for your Blobby Fish account.",
        p1: "New password", p2: "Repeat password", go: "Save",
        short: "At least " + MIN + " characters.", nomatch: "The two passwords do not match.",
        bad: "This link is not valid.", expired: "This link has expired. Request a new one in the game.",
        done: "Password changed", back: "You can sign in to the game now.", wait: "Saving..." },
  tr: { title: "Yeni parola", intro: "Blobby Fish hesabın için yeni bir parola belirle.",
        p1: "Yeni parola", p2: "Parolayı tekrar yaz", go: "Kaydet",
        short: "En az " + MIN + " karakter.", nomatch: "İki parola aynı değil.",
        bad: "Bağlantı geçersiz.", expired: "Bağlantının süresi doldu. Oyundan yeni bir tane iste.",
        done: "Parola değişti", back: "Artık oyuna giriş yapabilirsin.", wait: "Kaydediliyor..." },
  es: { title: "Nueva contraseña", intro: "Elige una nueva contraseña para tu cuenta de Blobby Fish.",
        p1: "Nueva contraseña", p2: "Repite la contraseña", go: "Guardar",
        short: "Al menos " + MIN + " caracteres.", nomatch: "Las contraseñas no coinciden.",
        bad: "El enlace no es válido.", expired: "El enlace ha caducado. Pide otro en el juego.",
        done: "Contraseña cambiada", back: "Ya puedes entrar en el juego.", wait: "Guardando..." },
  fr: { title: "Nouveau mot de passe", intro: "Choisis un nouveau mot de passe pour ton compte Blobby Fish.",
        p1: "Nouveau mot de passe", p2: "Répète le mot de passe", go: "Enregistrer",
        short: "Au moins " + MIN + " caractères.", nomatch: "Les deux mots de passe ne correspondent pas.",
        bad: "Ce lien n'est pas valide.", expired: "Ce lien a expiré. Demandes-en un nouveau dans le jeu.",
        done: "Mot de passe modifié", back: "Tu peux te connecter au jeu.", wait: "Enregistrement..." },
  pt: { title: "Nova senha", intro: "Escolha uma nova senha para sua conta do Blobby Fish.",
        p1: "Nova senha", p2: "Repita a senha", go: "Salvar",
        short: "Pelo menos " + MIN + " caracteres.", nomatch: "As senhas não coincidem.",
        bad: "Este link não é válido.", expired: "Este link expirou. Peça outro no jogo.",
        done: "Senha alterada", back: "Agora você pode entrar no jogo.", wait: "Salvando..." },
  de: { title: "Neues Passwort", intro: "Wähle ein neues Passwort für dein Blobby-Fish-Konto.",
        p1: "Neues Passwort", p2: "Passwort wiederholen", go: "Speichern",
        short: "Mindestens " + MIN + " Zeichen.", nomatch: "Die Passwörter stimmen nicht überein.",
        bad: "Dieser Link ist ungültig.", expired: "Dieser Link ist abgelaufen. Fordere im Spiel einen neuen an.",
        done: "Passwort geändert", back: "Du kannst dich jetzt im Spiel anmelden.", wait: "Speichern..." },
  ru: { title: "Новый пароль", intro: "Задайте новый пароль для аккаунта Blobby Fish.",
        p1: "Новый пароль", p2: "Повторите пароль", go: "Сохранить",
        short: "Не менее " + MIN + " символов.", nomatch: "Пароли не совпадают.",
        bad: "Ссылка недействительна.", expired: "Срок ссылки истёк. Запросите новую в игре.",
        done: "Пароль изменён", back: "Теперь можно войти в игру.", wait: "Сохранение..." },
  id: { title: "Kata sandi baru", intro: "Pilih kata sandi baru untuk akun Blobby Fish kamu.",
        p1: "Kata sandi baru", p2: "Ulangi kata sandi", go: "Simpan",
        short: "Minimal " + MIN + " karakter.", nomatch: "Kedua kata sandi tidak sama.",
        bad: "Tautan tidak valid.", expired: "Tautan sudah kedaluwarsa. Minta yang baru di game.",
        done: "Kata sandi diubah", back: "Sekarang kamu bisa masuk ke game.", wait: "Menyimpan..." },
  ms: { title: "Kata laluan baharu", intro: "Pilih kata laluan baharu untuk akaun Blobby Fish anda.",
        p1: "Kata laluan baharu", p2: "Ulang kata laluan", go: "Simpan",
        short: "Sekurang-kurangnya " + MIN + " aksara.", nomatch: "Kedua-dua kata laluan tidak sama.",
        bad: "Pautan tidak sah.", expired: "Pautan telah tamat tempoh. Minta yang baharu dalam permainan.",
        done: "Kata laluan ditukar", back: "Anda boleh log masuk sekarang.", wait: "Menyimpan..." },
  vi: { title: "Mật khẩu mới", intro: "Chọn mật khẩu mới cho tài khoản Blobby Fish của bạn.",
        p1: "Mật khẩu mới", p2: "Nhập lại mật khẩu", go: "Lưu",
        short: "Ít nhất " + MIN + " ký tự.", nomatch: "Hai mật khẩu không khớp.",
        bad: "Liên kết không hợp lệ.", expired: "Liên kết đã hết hạn. Hãy yêu cầu liên kết mới trong trò chơi.",
        done: "Đã đổi mật khẩu", back: "Bây giờ bạn có thể đăng nhập.", wait: "Đang lưu..." },
};

const q = new URLSearchParams(location.search);
const token = q.get("t") || "";
const c = T[q.get("lang")] || T.en;
document.documentElement.lang = q.get("lang") || "en";

const $ = (id) => document.getElementById(id);
$("t").textContent = c.title;
$("intro").textContent = c.intro;
$("p1").placeholder = c.p1;
$("p2").placeholder = c.p2;
$("p1").minLength = MIN;
$("p2").minLength = MIN;
$("go").textContent = c.go;
$("hint").textContent = c.short;

function fail(msg) {
  $("err").textContent = msg;
  $("err").hidden = false;
}

function finish(title, msg) {
  $("t").textContent = title;
  $("t").className = "";
  $("intro").textContent = msg;
  $("err").hidden = true;
  $("f").hidden = true;
  $("hint").textContent = "";
}

if (!/^[a-f0-9]{16,}$/.test(token)) {
  $("t").className = "bad";
  finish(c.title, c.bad);
  $("t").className = "bad";
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const p1 = $("p1").value, p2 = $("p2").value;
  if (p1.length < MIN) return fail(c.short);
  if (p1 !== p2) return fail(c.nomatch);
  $("go").disabled = true;
  $("go").textContent = c.wait;
  $("err").hidden = true;
  try {
    const res = await fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t: token, password: p1 }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) return finish(c.done, c.back);
    // Sunucunun anahtar kelimeleri; metni oyuncunun dilinde biz yazıyoruz ki
    // Rusça oynayan birine İngilizce hata çıkmasın.
    const map = { expired: c.expired, bad: c.bad, short: c.short };
    fail(map[data.error] || c.bad);
  } catch (_) {
    fail(c.bad);
  }
  $("go").disabled = false;
  $("go").textContent = c.go;
});
</script>
</body>
</html>
